<!DOCTYPE html>
<html>
<head>
  <title>Site Blocker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h3>Site Blocker</h3>

  <!-- Power Button -->
  <div class="power-container">
    <label class="power-switch">
      <input type="checkbox" id="powerToggle">
      <span class="power-slider"></span>
    </label>
    <span>Power</span>
  </div>

  <!-- Dark Mode -->
  <label class="row">
    Dark Mode
    <div class="switch">
      <input type="checkbox" id="darkModeToggle">
      <span class="slider"></span>
    </div>
  </label>

  <!-- Website Toggles -->
  <form id="siteForm">
    <label class="row">Facebook
      <div class="switch">
        <input type="checkbox" name="site" value="facebook.com">
        <span class="slider"></span>
      </div>
    </label>
    <label class="row">YouTube
      <div class="switch">
        <input type="checkbox" name="site" value="youtube.com">
        <span class="slider"></span>
      </div>
    </label>
    <label class="row">Instagram
      <div class="switch">
        <input type="checkbox" name="site" value="instagram.com">
        <span class="slider"></span>
      </div>
    </label>
    <label class="row">Twitter
      <div class="switch">
        <input type="checkbox" name="site" value="twitter.com">
        <span class="slider"></span>
      </div>
    </label>
  </form>

  <script src="popup.js"></script>
</body>
</html>
