<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            /* --color : rgb(255, 0 , 255); */
            /* --color : hsl(200, 100%, 50%); */
            color-scheme: light dark;
        }

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        html{
            font-size : 62.5%;
        }

        body{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box1{
            width: 40%;
            height: 20%;
            /* background: color(display-p3 1 0 0); */

            /* --->Relative color */
            /* Tweaking rgb values */
            background: rgb(from var(--color) r g b);
            background: rgb(from var(--color) 0 g b);
            background: rgb(from var(--color) calc(r + 200) g calc(b * .5));
            /* Tweaking hsl values */
            background: hsl(from var(--color) h s l);
            background: hsl(from var(--color) calc(h + 200) s calc(l * 1));
            /* Tweaking alpha values */
            background: hsl(from var(--color) calc(h + 200) s calc(l * 1) / 0.5);
            background: hsl(from var(--color) calc(h + 200) s calc(l * 1) / calc(alpha + .3));

            /* ---> Color-mix Function */
            background: color-mix(in srgb,var(--color) 40%, red 20%);
            /* hue wheel(longer, shorter) */
            background: color-mix(in hsl, longer hue, var(--color), red 20%);

            /* light dark scheme */
            background: light-dark(red, blue);


            /* flex */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: row;
            gap: 2rem;
        }

        /* .box2{
            width: 20%;
            height: 20%;
            background: black;
        } */
    </style>
</head>
<body>
    <div class="box1">
        <div class="box2"></div>
        <div class="box2"></div>
        <div class="box2"></div>
    </div>
</body>
</html>
