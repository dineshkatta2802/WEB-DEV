<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access Blocked</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #f44336; /* Red to indicate block */
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.25rem;
      max-width: 600px;
      line-height: 1.4;
    }
    .info {
      margin-top: 40px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>Access Blocked</h1>
  <p>
    The page you are trying to visit has been blocked by Obscura Extension for your safety and privacy.
  </p>
  <p class="info">
    If you believe this is an error, please check your extension settings or disable the blocking feature.
  </p>
</body>
</html>
