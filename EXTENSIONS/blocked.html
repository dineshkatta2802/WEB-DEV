<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access Blocked</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #f44336; /* Red to indicate block */
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.25rem;
      max-width: 600px;
      line-height: 1.4;
    }
    #back-button {
      margin-top: 30px;
      padding: 12px 24px;
      background: white;
      color: #f44336;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    #back-button:hover {
      transform: scale(1.05);
    }

    .info {
      margin-top: 20px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>Access Blocked</h1>
  <p>
    The page you are trying to visit has been blocked by Obscura Extension for your safety and privacy.
  </p>
  <button id="back-button" aria-label="Go back to safety">Go Back</button>
  <p class="info" role="alert">
    If you believe this is an error, please check your extension settings.
  </p>
<script>
    document.getElementById('back-button').addEventListener('click', () => {
      if (history.length > 1) {
        history.back();
      } else {
        window.location.href = 'chrome://newtab';
      }
    });
  </script>
</body>
</html>
