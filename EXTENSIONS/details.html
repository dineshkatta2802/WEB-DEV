<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OBSCURA - Details</title>
    <link rel="stylesheet" href="power_style.css">
    <link rel="stylesheet" href="details_style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>
<body>
    <div class="con">
        <div class="logowrap">
            <div class="logo">
                <button class="homeBtn"><i class="fa-solid fa-user-ninja"></i></button>
                <h1 class="logo-heading">OBSCURA</h1>
            </div>
            <button class="toggle"><i class="fa-solid fa-moon"></i></button>

            <div class="power-toggle">
                <label class="theme-switch">
                    <input type="checkbox" id="powerToggle" checked />
                    <span class="slider"k>
                        <i class="fa-solid fa-power-off toggle-icon"></i>
                    </span>
                </label>
            </div>
        </div>

        <div class="defaultWebsites" id="defaultWebsites">
            <div class="website">
                <i class="fa-brands fa-google"></i>
                <label class="theme-switch">
                    <input type="checkbox" checked />
                    <span class="slider">
                        <i class="fa-solid fa-lock toggle-icon lock"></i>
                        <i class="fa-solid fa-unlock toggle-icon unlock"></i>
                    </span>
                </label>
            </div>
            <div class="website">
                <i class="fa-brands fa-facebook"></i>
                <label class="theme-switch">
                    <input type="checkbox" checked/>
                    <span class="slider">
                        <i class="fa-solid fa-lock toggle-icon lock"></i>
                        <i class="fa-solid fa-unlock toggle-icon unlock"></i>
                    </span>
                </label>
            </div>
            <div class="website">
                <i class="fa-brands fa-x-twitter"></i>
                <label class="theme-switch">
                    <input type="checkbox" checked/>
                    <span class="slider">
                        <i class="fa-solid fa-lock toggle-icon lock"></i>
                        <i class="fa-solid fa-unlock toggle-icon unlock"></i>
                    </span>
                </label>
            </div>
            <div class="website">
                <i class="fa-brands fa-telegram"></i>
                <label class="theme-switch">
                    <input type="checkbox" checked/>
                    <span class="slider">
                        <i class="fa-solid fa-lock toggle-icon lock"></i>
                        <i class="fa-solid fa-unlock toggle-icon unlock"></i>
                    </span>
                </label>
            </div>
        </div>

        <div class="dropdown-container hidden" id="dropdownContainer">
            <button class="dropdown-toggle" onclick="toggleDropdown()">Show More</button>
            <div class="dropdown-content" id="dropdownContent"></div>
        </div>

        <div class="Addwebsite">
            <h2>Add New Site</h2>
            <button class="addBtn" id="openPopup"><i class="fa-solid fa-plus"></i></button>
        </div>
    </div>

    <!-- Popup -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-box">
            <h3>Add Website</h3>
            <input type="text" id="siteName" placeholder="Enter site name" />
            <input type="url" id="siteURL" placeholder="Enter site URL" />
            <div class="popup-actions">
                <button id="cancelBtn">Cancel</button>
                <button id="saveBtn">Add</button>
            </div>
        </div>
    </div>

    <script src="details.js"></script>
</body>
</html>
