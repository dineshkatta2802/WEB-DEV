<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            width: 100%;
            height: 100vh;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .con{
            width: 20rem;
            height: 20rem;
            display: flex;
            overflow-x: scroll;
            /* This line make sure that the .items element is not half or partially scrolled*/
            /* scroll-snap-type: x mandatory; */
        }

        .items{
            min-width: 20rem;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10rem;
            color: white;
            scroll-snap-align: center; /* This line is responsible for the div to be centered*/
        }

        .box1{ background-color: aqua; }
        .box2{ background-color: blue; }
        .box3{ background-color: blueviolet; }
        .box4{ background-color: chartreuse; }
        .box5{ background-color: crimson; }

    </style>
</head>
<body>
    <div class="con">
        <div class="items box1">1</div>
        <div class="items box2">2</div>
        <div class="items box3">3</div>
        <div class="items box4">4</div>
        <div class="items box5">5</div>
    </div>
</body>
</html>
