<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
    <rect 
        x ="100" 
        y="200" 
        width="200" 
        height="100" 
        fill="white" 
        stroke="blue" 
        stroke-width="5"
        rx="50"
    >

        <animate
            attributeName="width"
            from="0"
            to="200"
            dur="2s"
            fill="freeze"
            repeatCount="indefinite"
        />

        <animate
            attributeName="fill"
            values="red;blue;green;aqua"
            dur="4s"
            repeatCount="indefinite"
        />

    </rect>
</svg>